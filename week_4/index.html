<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Dashboard - Abdul Samad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="weather-card">
      <h1>Weather Dashboard</h1>
      <p class="subtitle">Check live weather by city name</p>

      <div class="search-box">
        <input type="text" id="cityInput" placeholder="Enter city name" />
        <button id="searchBtn">Search</button>
      </div>

      <div id="message" class="message"></div>

      <div id="weatherResult" class="weather-result hidden">
        <h2 id="cityName">City Name</h2>
        <p id="weatherDescription">Weather Description</p>

        <div class="weather-grid">
          <div class="weather-item">
            <span class="label">Temperature</span>
            <span id="temperature">--</span>
          </div>
          <div class="weather-item">
            <span class="label">Feels Like</span>
            <span id="feelsLike">--</span>
          </div>
          <div class="weather-item">
            <span class="label">Humidity</span>
            <span id="humidity">--</span>
          </div>
          <div class="weather-item">
            <span class="label">Wind Speed</span>
            <span id="windSpeed">--</span>
          </div>
          <div class="weather-item">
            <span class="label">Pressure</span>
            <span id="pressure">--</span>
          </div>
          <div class="weather-item">
            <span class="label">Visibility</span>
            <span id="visibility">--</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
